name: Build Debug Overlay

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: Randomblock1/theos-action@v1
        with:
          theos-dir: './theos'
      - name: Build tweak
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: DebugOverlay
          path: ./*.dylib
